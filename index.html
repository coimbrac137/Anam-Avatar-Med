<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Avatar com Sincronização de Voz IA</title>
<meta name="google" content="notranslate">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', Arial, sans-serif; background: #ffffff; color: #000;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .page-header { background: #000; color: #fff; position: relative; height: 95px; display: flex; align-items: center; flex-shrink: 0; }
  .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; text-decoration: none; height: 100%; }
  .back-btn img { height: 65px; width: auto; display: block; padding-left: 15px; }

  .page-content {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .page-footer { background: #000; color: #fff; height: 95px; flex-shrink: 0; }

  @media (max-width: 480px) {
    .page-header { height: 65px; }
    .back-btn img { height: 38px; padding-left: 10px; }
    .page-footer { height: 65px; }
  }
  @media (max-width: 360px) {
    .page-header { height: 58px; }
    .back-btn img { height: 32px; padding-left: 8px; }
    .page-footer { height: 58px; }
  }

  #frances-avatar-wrap {
    position: relative;
    width: 400px; height: 600px;
    max-width: 100%;
    z-index: 2147483647;
    overflow: hidden;
    border-radius: 12px;
    background: #000;
  }
  #frances-avatar-wrap iframe {
    width: 100%; height: 100%; border: none; display: block;
  }
  @media (max-width: 768px) {
    #frances-avatar-wrap { width: 320px; height: 480px; }
  }
  @media (max-width: 480px) {
    #frances-avatar-wrap { width: calc(100vw - 40px); height: 60vh; max-height: 480px; }
  }

  /* SUA FOTO */
  #frances-cover {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 85px;
    background: url('frances.png') center/cover no-repeat;
    z-index: 2;
    pointer-events: none; 
    transition: opacity 0.3s ease;
  }
  #frances-cover.hidden { opacity: 0; }
</style>
</head>
<body>
  <script>
    document.querySelectorAll('*').forEach(function(el) { el.setAttribute('translate', 'no'); el.classList.add('notranslate'); });
  </script>

  <div class="page-header notranslate" translate="no" id="pageHeader">
    <a href="#" class="back-btn"><img src="logo55.png" alt="Logo"></a>
  </div>

  <div class="page-content">
    <div id="frances-avatar-wrap" class="notranslate" translate="no">
      <iframe
        id="frances-iframe"
        src="https://app.livelayer.studio/widget/cmw5k76by000808jvsirev604"
        allow="microphone;camera"
        title="Avatar Frances"
      ></iframe>
      
      <div id="frances-cover"></div>
    </div>
  </div>

  <div class="page-footer notranslate" translate="no"></div>

  <script src="https://app.livelayer.studio/bridge.js"></script>

  <script>
    (function () {
      var cover = document.getElementById('frances-cover');
      var wrap = document.getElementById('frances-avatar-wrap');
      var hidden = false;

      function hideCover() {
        if (hidden) return;
        hidden = true;
        cover.classList.add('hidden');
        setTimeout(function() {
          if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
        }, 400);
      }

      // Evento global no document com capture: true.
      // Isso captura o clique ANTES de chegar no iframe.
      document.addEventListener('pointerdown', function (e) {
        if (!wrap.contains(e.target)) return;
        
        var rect = wrap.getBoundingClientRect();
        var y = e.clientY - rect.top;
        
        if (y > rect.height - 85) {
          hideCover();
        }
      }, true);

      document.addEventListener('touchstart', function (e) {
        if (!wrap.contains(e.target)) return;
        
        var rect = wrap.getBoundingClientRect();
        var t = e.touches[0];
        var y = t.clientY - rect.top;
        
        if (y > rect.height - 85) {
          hideCover();
        }
      }, { passive: true, capture: true });

    })();
  </script>

</body>
</html>
