<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Avatar com Sincronização de Voz IA</title>
<meta name="google" content="notranslate">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', Arial, sans-serif; background: #ffffff; color: #000;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .page-header { background: #000; color: #fff; position: relative; height: 95px; display: flex; align-items: center; flex-shrink: 0; }
  .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; text-decoration: none; height: 100%; }
  .back-btn img { height: 65px; width: auto; display: block; padding-left: 15px; }

  .page-content {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    padding-bottom: 0;
    min-height: 0;
  }

  .page-footer { background: #000; color: #fff; height: 95px; flex-shrink: 0; }

  @media (max-width: 480px) {
    .page-header { height: 65px; }
    .back-btn img { height: 38px; padding-left: 10px; }
    .page-footer { height: 65px; }
  }
  @media (max-width: 360px) {
    .page-header { height: 58px; }
    .back-btn img { height: 32px; padding-left: 8px; }
    .page-footer { height: 58px; }
  }

  #frances-avatar-wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 100%;
    min-height: calc(100vh - 95px - 95px - 20px);
    overflow: hidden;
    border-radius: 12px 12px 0 0;
    background: transparent;
    display: flex;
  }
  @media (max-width: 480px) {
    #frances-avatar-wrap {
      width: 100%;
      min-height: calc(100vh - 65px - 65px - 20px);
      border-radius: 0;
    }
  }

  anam-agent {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    flex: 1;
  }

  /* Força o vídeo interno do widget a preencher sem bordas pretas */
  anam-agent video, anam-agent > div {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  #end-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2147483647;
    padding: 20px;
  }
  #end-modal.show { display: flex; }

  #end-modal .box {
    background: #fff;
    color: #000;
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    font-family: 'Inter', Arial, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #end-modal .box h2 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  #end-modal .box p { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.4; }
  #end-modal .box button {
    width: 100%; padding: 12px 16px; font-size: 14px; font-weight: 500;
    color: #fff; background: #0d0d0d; border: none; border-radius: 999px;
    cursor: pointer; font-family: 'Inter', Arial, sans-serif;
  }
</style>
</head>
<body>
  <script>
    document.querySelectorAll('*').forEach(function(el) { el.setAttribute('translate', 'no'); el.classList.add('notranslate'); });
  </script>

  <div class="page-header notranslate" translate="no" id="pageHeader">
    <a href="#" class="back-btn"><img src="logo55.png" alt="Logo"></a>
  </div>

  <div class="page-content">
    <div id="frances-avatar-wrap" class="notranslate" translate="no">
      <anam-agent
        agent-id="9b87bb8a-1701-591d-9ed6-3f63c50f8fbc"
        api-base-url="https://lab.anam.ai"
      ></anam-agent>
    </div>
  </div>

  <div id="end-modal" class="notranslate" translate="no">
    <div class="box">
      <h2>Consulta encerrada</h2>
      <p>Obrigado pela simulação. Você pode iniciar uma nova consulta quando quiser.</p>
      <button id="end-close">Fechar</button>
    </div>
  </div>

  <div class="page-footer notranslate" translate="no"></div>

  <script src="https://unpkg.com/@anam-ai/agent-widget" async></script>

  <script>
    (function () {
      var modal = document.getElementById('end-modal');
      var closeBtn = document.getElementById('end-close');

      function attach() {
        var widget = document.querySelector('anam-agent');
        if (!widget) { setTimeout(attach, 300); return; }

        widget.addEventListener('anam-agent:session-ended', function (e) {
          console.log('sessão encerrada:', e.detail);
          modal.classList.add('show');
        });
      }

      closeBtn.addEventListener('click', function () {
        modal.classList.remove('show');
      });

      attach();
    })();
  </script>

</body>
</html>
