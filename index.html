<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Avatar com Sincronização de Voz IA</title>
<meta name="google" content="notranslate">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', Arial, sans-serif; background: #ffffff; color: #000;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .page-header { background: #000; color: #fff; position: relative; height: 95px; display: flex; align-items: center; flex-shrink: 0; }
  .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; text-decoration: none; height: 100%; }
  .back-btn img { height: 65px; width: auto; display: block; padding-left: 15px; }

  .page-content {
    flex: 1 1 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
    min-height: 0;
  }

  .page-footer { background: #000; color: #fff; height: 95px; flex-shrink: 0; }

  @media (max-width: 480px) {
    .page-header { height: 65px; }
    .back-btn img { height: 38px; padding-left: 10px; }
    .page-footer { height: 65px; }
  }
  @media (max-width: 360px) {
    .page-header { height: 58px; }
    .back-btn img { height: 32px; padding-left: 8px; }
    .page-footer { height: 58px; }
  }

  #frances-avatar-wrap {
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: calc(100vh - 95px - 95px - 40px - 70px);
    max-height: 700px;
    overflow: hidden;
    border-radius: 12px 12px 0 0;
    background: transparent;
    display: flex;
    margin: 0 auto;
  }
  @media (max-width: 480px) {
    #frances-avatar-wrap {
      width: 100%;
      height: calc(100vh - 65px - 65px - 40px - 60px);
      max-height: none;
      border-radius: 12px 12px 0 0;
    }
  }

  anam-agent {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    flex: 1;
  }

  /* Força o vídeo interno do widget a preencher sem bordas pretas */
  anam-agent video, anam-agent > div {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  #timer-bar {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    background: #0d0d0d;
    color: #fff;
    border-radius: 0 0 12px 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  @media (max-width: 480px) {
    #timer-bar {
      border-radius: 0 0 12px 12px;
      padding: 12px 16px;
      font-size: 18px;
    }
  }
  #timer-bar i {
    font-size: 18px;
    opacity: 0.8;
  }
  #timer-bar .label {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #timer-display {
    font-variant-numeric: tabular-nums;
  }

  #end-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2147483647;
    padding: 20px;
  }
  #end-modal.show { display: flex; }

  #end-modal .box {
    background: #fff;
    color: #000;
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    font-family: 'Inter', Arial, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #end-modal .box h2 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  #end-modal .box p { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.4; }
  #end-modal .box button {
    width: 100%; padding: 12px 16px; font-size: 14px; font-weight: 500;
    color: #fff; background: #0d0d0d; border: none; border-radius: 999px;
    cursor: pointer; font-family: 'Inter', Arial, sans-serif;
  }
</style>
</head>
<body>
  <script>
    document.querySelectorAll('*').forEach(function(el) { el.setAttribute('translate', 'no'); el.classList.add('notranslate'); });
  </script>

  <div class="page-header notranslate" translate="no" id="pageHeader">
    <a href="#" class="back-btn"><img src="logo55.png" alt="Logo"></a>
  </div>

  <div class="page-content">
    <div id="frances-avatar-wrap" class="notranslate" translate="no">
      <anam-agent
        agent-id="9b87bb8a-1701-591d-9ed6-3f63c50f8fbc"
        api-base-url="https://lab.anam.ai"
      ></anam-agent>
    </div>

    <div id="timer-bar" class="notranslate" translate="no">
      <i class="fa-regular fa-clock"></i>
      <span class="label">Tempo</span>
      <span id="timer-display">00:00</span>
    </div>
  </div>

  <div id="end-modal" class="notranslate" translate="no">
    <div class="box">
      <h2>Consulta encerrada</h2>
      <p>Obrigado pela simulação. Aguarde a publicação do seu perfil.</p>
      <button id="end-close">Ver relatório</button>
    </div>
  </div>

  <div class="page-footer notranslate" translate="no"></div>

  <script src="https://unpkg.com/@anam-ai/agent-widget" async></script>

  <script>
    (function () {
      var modal = document.getElementById('end-modal');
      var closeBtn = document.getElementById('end-close');
      var timerDisplay = document.getElementById('timer-display');

      // Tempo limite da chamada em milissegundos (5 segundos para teste)
      var CALL_DURATION_MS = 5 * 1000;
      var endTimer = null;

      // Cronômetro
      var tickInterval = null;
      var elapsedMs = 0;

      // Transcrições
      var messages = [];

      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      function formatTime(ms) {
        var totalSec = Math.floor(ms / 1000);
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return pad(m) + ':' + pad(s);
      }

      function startChronometer() {
        stopChronometer();
        elapsedMs = 0;
        timerDisplay.textContent = formatTime(0);
        tickInterval = setInterval(function () {
          elapsedMs += 1000;
          timerDisplay.textContent = formatTime(elapsedMs);
        }, 1000);
      }

      function stopChronometer() {
        if (tickInterval) {
          clearInterval(tickInterval);
          tickInterval = null;
        }
      }

      function goToReport() {
        try {
          sessionStorage.setItem('consultReport', JSON.stringify({
            durationMs: elapsedMs,
            messages: messages
          }));
        } catch (err) {
          console.log('erro ao salvar relatório:', err);
        }
        window.location.href = 'relatorio.html';
      }

      // Procura recursivamente dentro de shadow roots pelo botão de encerrar (X)
      function findEndButton(root) {
        if (!root) return null;

        var svgs = root.querySelectorAll ? root.querySelectorAll('svg') : [];
        for (var i = 0; i < svgs.length; i++) {
          var paths = svgs[i].querySelectorAll('path');
          for (var j = 0; j < paths.length; j++) {
            var d = paths[j].getAttribute('d') || '';
            if (d.indexOf('M18 6L6 18') !== -1) {
              var btn = svgs[i].closest('button, [role="button"], a');
              if (btn) return btn;
              return svgs[i].parentElement;
            }
          }
        }

        var candidates = root.querySelectorAll
          ? root.querySelectorAll('button, [role="button"]')
          : [];
        for (var k = 0; k < candidates.length; k++) {
          var label = (candidates[k].getAttribute('aria-label') || '') + ' ' +
                      (candidates[k].getAttribute('title') || '');
          if (/end|close|encerrar|sair|stop|hang|leave/i.test(label)) {
            return candidates[k];
          }
        }

        var all = root.querySelectorAll ? root.querySelectorAll('*') : [];
        for (var m = 0; m < all.length; m++) {
          if (all[m].shadowRoot) {
            var found = findEndButton(all[m].shadowRoot);
            if (found) return found;
          }
        }
        return null;
      }

      function encerrarChamada() {
        var widget = document.querySelector('anam-agent');
        var clicked = false;

        if (widget) {
          try {
            var btn = findEndButton(widget.shadowRoot || widget);
            if (btn) {
              btn.click();
              clicked = true;
              console.log('botão X clicado via shadow DOM');
            }
          } catch (err) {
            console.log('erro ao procurar botão X:', err);
          }

          if (!clicked) {
            try {
              if (typeof widget.endSession === 'function') {
                widget.endSession();
                clicked = true;
              } else if (typeof widget.stop === 'function') {
                widget.stop();
                clicked = true;
              }
            } catch (err) {
              console.log('erro ao encerrar via API:', err);
            }
          }
        }

        setTimeout(function () {
          modal.classList.add('show');
        }, 400);
      }

      function attach() {
        var widget = document.querySelector('anam-agent');
        if (!widget) { setTimeout(attach, 300); return; }

        widget.addEventListener('anam-agent:session-started', function (e) {
          console.log('sessão iniciada:', e.detail);
          startChronometer();
          if (endTimer) clearTimeout(endTimer);
          endTimer = setTimeout(encerrarChamada, CALL_DURATION_MS);
        });

        widget.addEventListener('anam-agent:session-ended', function (e) {
          console.log('sessão encerrada:', e.detail);
          stopChronometer();
          if (endTimer) { clearTimeout(endTimer); endTimer = null; }
          modal.classList.add('show');
        });

        widget.addEventListener('anam-agent:message-received', function (e) {
          console.log('mensagem recebida:', e.detail);
          var d = e.detail || {};
          var text = d.text || d.content || d.transcript || d.message || '';
          if (text && typeof text === 'string' && text.trim()) {
            messages.push(text.trim());
          }
        });
      }

      closeBtn.addEventListener('click', function () {
        goToReport();
      });

      attach();
    })();
  </script>

</body>
</html>
